# Munch Solen Light — sampled from the UiO Aula TIFF of Edvard Munch, *The Sun*.
#
# Paper UI on the mural: straw halo as the page, rock cleft as ink, cadmium
# rays for focus. Same scan and roles as munch-solen-dark; surfaces inverted.
# Chrome yellow is darkened for type on paper — the wall still holds the bright disk.
#
# Semantic names are the source of truth. Compact aliases and color0–color15
# mirror them for templates and older integrations.
mode = "light"

accent = "#C44838"
hyprland_active_border = "rgba(c44838ee) rgba(c8b040ee) rgba(7a6e3add) 90deg"
hyprland_inactive_border = "rgba(7c6c5baa)"

background = "#F7EED7"
dark_background = "#EFE2BF"
darker_background = "#DBCBAA"
lighter_background = "#FBF4E4"

foreground = "#1A1E32"
dark_foreground = "#7A6044"
light_foreground = "#32364A"
bright_foreground = "#0E101C"

selection = "#EED0BA"
muted = "#7C6C5B"

red = "#B84838"
orange = "#C85A38"
yellow = "#7A6E3A"
green = "#5E7241"
